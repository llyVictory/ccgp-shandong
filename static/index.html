<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山东省政府采购意向爬虫控制台</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-size: 1.1rem;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 95%;
            max-width: 1000px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 2rem 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        /* 框样式 */
        .config-box {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .global-box {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(99, 102, 241, 0.05);
        }

        .inner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .sub-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        .box-title {
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
            color: #818cf8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sub-box-title {
            margin: 0 0 1rem 0;
            font-size: 1rem;
            color: #cbd5e1;
            font-weight: 600;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            border: none;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: auto;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        #startBtn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); }
        #createScheduleBtn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }

        /* 日志与下载 */
        #logConsole {
            margin-top: 1.5rem;
            background: #020617;
            border-radius: 0.5rem;
            padding: 0.75rem;
            border: 1px solid #1e293b;
            display: none;
        }

        #logContent {
            height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 0.5rem;
        }

        .log-entry { padding: 0.2rem 0; border-bottom: 1px solid #1e293b; }

        #status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            display: none;
        }

        .running { background: rgba(99, 102, 241, 0.1); color: #818cf8; }
        .completed { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .failed { background: rgba(239, 68, 68, 0.1); color: #f87171; }

        #downloadBtn { background: #22c55e; margin-top: 1rem; display: none; }

        /* 隐藏的原生下拉 */
        .hidden-select { display: none; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .inner-grid { grid-template-columns: 1fr; }
        }

        /* 定时任务状态条 */
        .schedule-banner {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>山东政采爬虫控制台</h1>

        <!-- 框 1: 公共配置总框 -->
        <div class="config-box global-box">
            <h2 class="box-title">🌍 [ 公共配置 ] 区域设置</h2>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem;">
                ⚠️ 此处配置的选择将同时应用于“测试执行”和“定时任务”
            </div>
            
            <div class="form-group">
                <label>选择抓取省/市/区县</label>
                <select id="area">
                    <option value="370000">山东省本级</option>
                    <option value="370100">济南市</option>
                    <option value="370200">青岛市</option>
                    <option value="370300">淄博市</option>
                    <option value="370400">枣庄市</option>
                    <option value="370500">东营市</option>
                    <option value="370600">烟台市</option>
                    <option value="370700">潍坊市</option>
                    <option value="370800">济宁市</option>
                    <option value="370900">泰安市</option>
                    <option value="371000">威海市</option>
                    <option value="371100">日照市</option>
                    <option value="371300">临沂市</option>
                    <option value="371400">德州市</option>
                    <option value="371500">聊城市</option>
                    <option value="371600">滨州市</option>
                    <option value="371700">菏泽市</option>
                </select>
            </div>

            <!-- 子框容器 -->
            <div class="inner-grid">
                <!-- 框 2: 测试执行框 -->
                <div class="sub-box">
                    <h3 class="sub-box-title">🚀 立即测试 / 手动补录</h3>
                    <div class="form-group">
                        <label>主题关键字 (可选)</label>
                        <input type="text" id="title" placeholder="例如: 办公家具 / 电脑" style="padding: 0.5rem; font-size: 0.9rem;">
                    </div>
                    <div class="form-group">
                        <label>单次任务的时间范围</label>
                        <select id="quickTime">
                            <option value="" selected>默认 (昨14h-今14h)</option>
                            <option value="0">今日 (00:00-至今)</option>
                            <option value="7">近7天</option>
                            <option value="30">近30天</option>
                            <option value="custom">自定义日期范围</option>
                        </select>
                    </div>
                    <div id="customTimeRange" style="display: none; gap: 0.5rem; margin-bottom: 1rem;">
                        <input type="date" id="startTime" style="padding: 0.5rem; font-size: 0.8rem;">
                        <input type="date" id="endTime" style="padding: 0.5rem; font-size: 0.8rem;">
                    </div>
                    <button id="startBtn">立即测试一下</button>
                </div>

                <!-- 框 3: 定时任务框 -->
                <div class="sub-box" style="border-color: rgba(16, 185, 129, 0.2);">
                    <h3 class="sub-box-title">⏰ 长期策略 / 定时任务</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem;">
                        <div>
                            <label style="font-size: 0.8rem;">执行时间-时</label>
                            <input type="number" id="scheduleHour" value="16" min="0" max="23">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem;">执行时间-分</label>
                            <input type="text" id="scheduleMinute" value="00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="font-size: 0.8rem;">定时爬取的数据日期范围 (留空则相对当天)</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;">
                            <input type="date" id="scheduleStartTime" style="padding: 0.4rem; font-size: 0.8rem;" title="起">
                            <input type="date" id="scheduleEndTime" style="padding: 0.4rem; font-size: 0.8rem;" title="止">
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="font-size: 0.8rem;">保存位置</label>
                        <input type="text" id="downloadPath" value="D:\spider_downloads" style="padding: 0.5rem; font-size: 0.8rem;">
                    </div>
                    <button id="createScheduleBtn">保存并启用定时</button>
                </div>
            </div>
        </div>

        <!-- 辅助字段 -->
        <input type="hidden" id="startPage" value="1">
        <input type="hidden" id="maxPages" value="100">
        <input type="checkbox" id="useProxy" style="display: none;">

        <!-- 只有开启时才显示的任务看板 -->
        <div id="scheduleStatus" class="schedule-banner" style="display: none;">
            <div id="scheduleInfo"></div>
            <button id="deleteScheduleBtn" style="width: auto; padding: 0.4rem 1rem; background: #ef4444; font-size: 0.8rem; margin: 0;">取消定时</button>
        </div>

        <!-- 状态、日志、下载 -->
        <div id="status"></div>
        <div id="logConsole">
            <div style="display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 0.4rem; color: #64748b;">
                <span>实时任务日志</span>
                <span id="logCount">0 lines</span>
            </div>
            <div id="logContent"></div>
        </div>
        <button id="downloadBtn">📥 点击下载生成的 Excel 文件</button>

    </div>

    <script>
        let currentTaskId = null;
        const startBtn = document.getElementById('startBtn');
        const createScheduleBtn = document.getElementById('createScheduleBtn');
        const deleteScheduleBtn = document.getElementById('deleteScheduleBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const quickTime = document.getElementById('quickTime');
        const customTimeRange = document.getElementById('customTimeRange');
        const logConsole = document.getElementById('logConsole');
        const logContent = document.getElementById('logContent');
        const logCount = document.getElementById('logCount');

        // 加载状态
        async function loadScheduleStatus() {
            try {
                const resp = await fetch('/api/schedule/status');
                const data = await resp.json();
                if (data.hasTask && data.config) {
                    document.getElementById('scheduleStatus').style.display = 'flex';
                    const infoHTML = `
                        <div style="font-size: 0.85rem; color: #4ade80; line-height: 1.4;">
                            <strong>定时中:</strong> 每天 ${String(data.config.hour).padStart(2, '0')}:${String(data.config.minute).padStart(2, '0')} | 
                            日期: ${data.config.startTime || '循环前1日'} ~ ${data.config.endTime || '循环当日'}
                        </div>
                    `;
                    document.getElementById('scheduleInfo').innerHTML = infoHTML;
                    document.getElementById('scheduleHour').value = data.config.hour;
                    document.getElementById('scheduleMinute').value = String(data.config.minute).padStart(2, '0');
                    document.getElementById('downloadPath').value = data.config.downloadPath;
                    if (data.config.startTime) document.getElementById('scheduleStartTime').value = data.config.startTime;
                    if (data.config.endTime) document.getElementById('scheduleEndTime').value = data.config.endTime;
                } else {
                    document.getElementById('scheduleStatus').style.display = 'none';
                }
            } catch (e) { console.error('Status sync failed', e); }
        }

        loadScheduleStatus();

        quickTime.onchange = () => {
            if (quickTime.value === 'custom') {
                customTimeRange.style.display = 'flex';
            } else {
                customTimeRange.style.display = 'none';
                const days = parseInt(quickTime.value || 0);
                const end = new Date();
                const start = new Date();
                start.setDate(end.getDate() - days);
                document.getElementById('startTime').value = start.toISOString().split('T')[0];
                document.getElementById('endTime').value = end.toISOString().split('T')[0];
            }
        };

        function showStatus(msg, type = 'running') {
            statusDiv.style.display = 'block';
            statusDiv.className = type;
            statusDiv.innerText = msg;
        }

        startBtn.onclick = async () => {
            const qt = quickTime.value;
            let sTime, eTime;
            if (qt === 'custom') {
                sTime = document.getElementById('startTime').value;
                eTime = document.getElementById('endTime').value;
            } else {
                sTime = qt;
                eTime = "";
            }

            const payload = {
                area: document.getElementById('area').value,
                startTime: sTime,
                endTime: eTime,
                startPage: 1,
                maxPages: 100,
                title: "",
                useProxy: false
            };

            startBtn.disabled = true;
            showStatus('任务开始执行...', 'running');
            downloadBtn.style.display = 'none';
            logConsole.style.display = 'block';
            logContent.innerHTML = '';

            try {
                const resp = await fetch('/api/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const { task_id } = await resp.json();
                currentTaskId = task_id;
                checkStatus();
            } catch (e) {
                showStatus('启动失败: ' + e, 'failed');
                startBtn.disabled = false;
            }
        };

        async function checkStatus() {
            if (!currentTaskId) return;
            try {
                const resp = await fetch('/api/status/' + currentTaskId);
                const res = await resp.json();
                if (res.logs) {
                    logCount.innerText = res.logs.length + ' lines';
                    logContent.innerHTML = res.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
                    logContent.scrollTop = logContent.scrollHeight;
                }
                if (res.status === 'running') {
                    setTimeout(checkStatus, 2000);
                } else if (res.status === 'completed') {
                    showStatus('抓取成功！', 'completed');
                    downloadBtn.style.display = 'block';
                    startBtn.disabled = false;
                } else {
                    showStatus('任务终止: ' + (res.error || '未知错误'), 'failed');
                    startBtn.disabled = false;
                }
            } catch (e) { console.error(e); }
        }

        createScheduleBtn.onclick = async () => {
            const body = {
                area: document.getElementById('area').value,
                hour: parseInt(document.getElementById('scheduleHour').value),
                minute: parseInt(document.getElementById('scheduleMinute').value),
                downloadPath: document.getElementById('downloadPath').value.trim(),
                startTime: document.getElementById('scheduleStartTime').value,
                endTime: document.getElementById('scheduleEndTime').value
            };
            try {
                const resp = await fetch('/api/schedule/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if ((await resp.json()).success) {
                    showStatus('定时任务已生效', 'completed');
                    loadScheduleStatus();
                }
            } catch (e) { showStatus('设置定时失败: ' + e, 'failed'); }
        };

        deleteScheduleBtn.onclick = async () => {
            try {
                const resp = await fetch('/api/schedule/delete', { method: 'DELETE' });
                if ((await resp.json()).success) {
                    showStatus('定时任务已取消', 'completed');
                    loadScheduleStatus();
                }
            } catch (e) { showStatus('取消失败', 'failed'); }
        };

        downloadBtn.onclick = () => {
            window.location.href = '/api/download/' + currentTaskId;
        };
    </script>
</body>
</html>
